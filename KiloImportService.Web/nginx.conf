# ════════════════════════════════════════════════════════════════════
# nginx.conf — prod-stage Web/Dockerfile (см. doc_project/130)
# Раздаёт SPA-бандл из /usr/share/nginx/html.
# Запускается под non-root user `nginx`, listen 8080 (привилегированные
# порты <1024 недоступны не-root'у).
# ════════════════════════════════════════════════════════════════════

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Базовые security-headers (см. doc_project/121).
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # Кэширование статических ассетов (с hash в имени) — год.
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: любой нераспознанный путь → index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Заведомо запрещаем доступ к скрытым файлам (.git/.env и т.п.).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
