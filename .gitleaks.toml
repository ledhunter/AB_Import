# ══════════════════════════════════════════════════════════════════
# Конфигурация Gitleaks
# ══════════════════════════════════════════════════════════════════
# Документация: https://github.com/gitleaks/gitleaks#configuration
#
# Цель — наследовать встроенный набор детекторов (он покрывает реальные
# секреты: AWS/GCP/токены/private keys) и сузить scope ровно для одного
# случая false-positive — placeholder'ы в шаблонах `.env.*.example`.
#
# История (см. doc_project/121-security-fixes-appsec-v1.md § AppSec v3):
# Gitleaks флагал `unused_in_prod` / `unused_in_preprod` / `__FILL__` у
# password-подобных ключей как «Generic Key». Это были разовые шаблонные
# заглушки. В v3 значения убраны (`KEY=`), gitleaks больше не должен
# срабатывать, но allowlist-paths гарантирует, что любые БУДУЩИЕ
# placeholder'ы в `.example`-шаблонах не вызовут регрессии скана.
#
# ⚠️ В allowlist попадают ИСКЛЮЧИТЕЛЬНО шаблоны (`.env.*.example`),
#    рабочие `.env`/`.env.local` остаются под полным сканированием
#    (они gitignored, в репу не попадают, но если кто-то нечаянно
#    закоммитит — gitleaks поймает).
# ══════════════════════════════════════════════════════════════════

[extend]
# Использовать встроенный набор правил Gitleaks как базу.
useDefault = true

# ─── Allowlist: шаблоны переменных среды ────────────────────────
# Файлы `.env.*.example` и `.env.example` — это публичные шаблоны
# конфигурации, документирующие, какие переменные ожидает приложение.
# Никаких реальных секретов они не содержат и содержать не должны
# (см. § AppSec v3 — все placeholder-значения убраны).
[[allowlists]]
description = "Env-шаблоны: .env.example и .env.<env>.example содержат только placeholder'ы (см. doc 121 § AppSec v3)"
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)\.env\..+\.example$''',
]
