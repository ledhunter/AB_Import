# ════════════════════════════════════════════════════════════════════
# KiloImportService — локальный dev-стенд (frontend + backend + 1×Postgres)
# ════════════════════════════════════════════════════════════════════
#
#  Запуск:    docker compose up -d
#  Логи:      docker compose logs -f backend
#  Остановка: docker compose down
#  Полный сброс БД: docker compose down -v
#
#  URL'ы:
#    UI:        http://localhost:5173
#    Backend:   http://localhost:5000  (Swagger: /swagger)
#    Postgres:  localhost:5433  (db: ab_fm_import, две схемы: import + Data)
#
# Архитектура (см. doc 145 — вариант B1):
#   • Одна физическая БД `ab_fm_import` — одна connection-string
#     `ConnectionStrings__AbFmImport`.
#   • Внутри БД две схемы: `import` (служебные таблицы, миграции
#     ImportServiceDbContext) и `Data` (mirror справочников Visary,
#     миграции VisaryDbContext / Initial_DataSchema).
#   • Старые init-скрипты `db/visary/init/*.sql` удалены — схему Data
#     создаёт EF-миграция при первом запуске backend.
#   • Имена секций конфига — эталон service-dev (см. doc 132):
#     EndpointsConfiguration:VisaryApi/VisaryAuthApi, JwtConfiguration,
#     Features:Swagger/RequireJwt, Cors (строка).
# ════════════════════════════════════════════════════════════════════

name: kilo-import

services:
  # ──────────────────────────── PostgreSQL: единая БД сервиса ────────────────────────────
  postgres:
    # Параметризация для корп. контура (см. doc 129). Дефолт — публичный docker.io.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: kilo-import-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ab_fm_import
      POSTGRES_USER: ${ABFMI_DB_USER:?ABFMI_DB_USER не задан — скопируй .env.example → .env (см. doc 145)}
      POSTGRES_PASSWORD: ${ABFMI_DB_USER_PASSWORD:?ABFMI_DB_USER_PASSWORD не задан — скопируй .env.example → .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ab_fm_import"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kilo-net

  # ──────────────────────────── Backend: .NET 10 Web API ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: KiloImportService.Api/Dockerfile
      # Build-args для корп. контура (см. doc 129). Дефолты — публичные хосты,
      # сборка работает «из коробки». В закрытом контуре задать переменные в .env.
      args:
        # ⚠️ Тег `10.0-alpine` (GA), НЕ `10.0-preview-alpine` — Microsoft пересобирает
        # только GA-тег при security-update'ах Alpine (см. doc 137 v1.6 / doc 143).
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0-alpine}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0-alpine}
        NUGET_FEED_URL: ${NUGET_FEED_URL:-https://api.nuget.org/v3/index.json}
        ALPINE_REPOSITORIES_URL: ${ALPINE_REPOSITORIES_URL:-}
        ALPINE_OPENSSL_EDGE_FALLBACK: ${ALPINE_OPENSSL_EDGE_FALLBACK:-false}
        ALPINE_EDGE_REPO_URL: ${ALPINE_EDGE_REPO_URL:-https://dl-cdn.alpinelinux.org/alpine/edge/main}
    container_name: kilo-import-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      # ─── ConnectionStrings (эталон, см. doc 145) ───
      # Одна БД `ab_fm_import` под обе схемы (import + Data). В prod / preprod —
      # managed-PG, задаётся `ConnectionStrings__AbFmImport` целиком из Vault.
      ConnectionStrings__AbFmImport: ${ConnectionStrings__AbFmImport:-Host=postgres;Port=5432;Database=ab_fm_import;Username=${ABFMI_DB_USER};Password=${ABFMI_DB_USER_PASSWORD};Application Name=kilo-import-api;Pooling=true}
      # ─── Прочие секции (эталон) ───
      ImportStorage__Path: /var/lib/import-files
      # Cors: origin UI per-среда. Эталон держит как одну строку (см. doc 145).
      # Несколько origin'ов — через запятую (поддерживается в Program.cs).
      Cors: ${UI_PUBLIC_URL:?UI_PUBLIC_URL не задан — скопируй .env.example → .env (см. doc 122)}
      # Visary API (per-среда). SSOT — VISARY_BASE_URL в .env.
      # Deny-by-default: без значения сервис не стартует, чтобы хост test-стенда
      # не уехал случайно в prod.
      EndpointsConfiguration__VisaryApi__Endpoint: ${VISARY_BASE_URL:?VISARY_BASE_URL не задан — скопируй .env.example → .env (см. doc 122)}
      EndpointsConfiguration__VisaryApi__BearerToken: ${EndpointsConfiguration__VisaryApi__BearerToken:-}
      # OIDC refresh-flow (если задан TokenEndpoint, см. doc 107)
      EndpointsConfiguration__VisaryAuthApi__TokenEndpoint: ${EndpointsConfiguration__VisaryAuthApi__TokenEndpoint:-}
      EndpointsConfiguration__VisaryAuthApi__ClientId: ${EndpointsConfiguration__VisaryAuthApi__ClientId:-visary-ui}
      VISARY_AUTH_REFRESH_TOKEN: ${VISARY_AUTH_REFRESH_TOKEN:-}
      # JWT-валидация ВХОДЯЩИХ запросов (см. doc 111).
      # `Features:RequireJwt=true` + `JwtConfiguration:Authority` — основной триггер.
      # Пусто/false = выключено (legacy/dev).
      Features__Swagger: ${Features__Swagger:-false}
      Features__RequireJwt: ${Features__RequireJwt:-false}
      # Reverse-proxy base-path (см. doc 147). Пусто = маршруты от корня '/'
      # (локалка). На стенде задаётся `Features__PathBase=/api/ab-fm-import`
      # через helm values.
      Features__PathBase: ${Features__PathBase:-}
      JwtConfiguration__Authority: ${JwtConfiguration__Authority:-}
      JwtConfiguration__Audience: ${JwtConfiguration__Audience:-kilo-import-api}
      JwtConfiguration__UseSsl: ${JwtConfiguration__UseSsl:-true}
    ports:
      - "5000:5000"
    volumes:
      - import-files:/var/lib/import-files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - kilo-net

  # ──────────────────────────── Frontend: React + Vite ──────────────────────────────────────
  frontend:
    build:
      context: ./KiloImportService.Web
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org}
        NPM_REGISTRY_ALFALAB_URL: ${NPM_REGISTRY_ALFALAB_URL:-https://registry.npmjs.org/}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
        ALPINE_REPOSITORIES_URL: ${ALPINE_REPOSITORIES_URL:-}
        ALPINE_OPENSSL_EDGE_FALLBACK: ${ALPINE_OPENSSL_EDGE_FALLBACK:-false}
        ALPINE_EDGE_REPO_URL: ${ALPINE_EDGE_REPO_URL:-https://dl-cdn.alpinelinux.org/alpine/edge/main}
        # Reverse-proxy base-path (см. doc 147). Используется только prod-stage
        # (`vite build`). В compose `target: dev` сборка не вызывается — ARG'и
        # игнорируются, но прокидываем «впрок», чтобы локальный build target=prod
        # (`docker compose build --build-arg=...`) подхватывал env из .env.
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
        VITE_API_PREFIX: ${VITE_API_PREFIX:-}
    container_name: kilo-import-frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:5000
      VITE_VISARY_API_URL: ${VISARY_BASE_URL:?VISARY_BASE_URL не задан — скопируй .env.example → .env (см. doc 122)}
      VITE_VISARY_API_TOKEN: ${VITE_VISARY_API_TOKEN:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - kilo-net

# ──────────────────────────── Persistence ────────────────────────────────────
volumes:
  pg-data:
    name: kilo-import_pg-data
  import-files:
    name: kilo-import_import-files

networks:
  kilo-net:
    name: kilo-import_net
    driver: bridge
