# ════════════════════════════════════════════════════════════════════
# KiloImportService — локальная dev-стенд (frontend + backend + 2×Postgres)
# ════════════════════════════════════════════════════════════════════
#
#  Запуск:    docker compose up -d
#  Логи:      docker compose logs -f backend
#  Остановка: docker compose down
#  Полный сброс БД: docker compose down -v
#
#  URL'ы:
#    UI:        http://localhost:5173
#    Backend:   http://localhost:5000  (Swagger: /swagger)
#    Postgres service-db: localhost:5433  (db: import_service_db)
#    Postgres visary-db:  localhost:5434  (db: visary_webapi_db)
# ════════════════════════════════════════════════════════════════════

name: kilo-import

services:
  # ──────────────────────────── PostgreSQL: служебная БД сервиса ────────────────────────────
  postgres-service:
    # Параметризация для корп. контура (см. doc_project/129). Дефолт — публичный docker.io.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: kilo-import-pg-service
    restart: unless-stopped
    environment:
      POSTGRES_DB: import_service_db
      POSTGRES_USER: ${IMPORT_SERVICE_DB_USER:?IMPORT_SERVICE_DB_USER не задан — скопируй .env.example → .env (см. doc_project/121)}
      POSTGRES_PASSWORD: ${IMPORT_SERVICE_DB_PASSWORD:?IMPORT_SERVICE_DB_PASSWORD не задан — скопируй .env.example → .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pg-service-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d import_service_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kilo-net

  # ──────────────────────────── PostgreSQL: целевая БД (срез Visary) ────────────────────────
  postgres-visary:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: kilo-import-pg-visary
    restart: unless-stopped
    environment:
      POSTGRES_DB: visary_webapi_db
      POSTGRES_USER: ${VISARY_DB_USER:?VISARY_DB_USER не задан — скопируй .env.example → .env (см. doc_project/121)}
      POSTGRES_PASSWORD: ${VISARY_DB_PASSWORD:?VISARY_DB_PASSWORD не задан — скопируй .env.example → .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - pg-visary-data:/var/lib/postgresql/data
      # Init-скрипты выполняются один раз при создании БД (по алфавиту):
      #   01-schema.sql       — CREATE TABLE/FK (66 таблиц из CSV)
      #   02-missing-roots.sql — ConstructionProject/Site + 30 FK
      #   03-seed-data.sql    — справочники (User, RoomKind, тестовый проект)
      - ./db/visary/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d visary_webapi_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kilo-net

  # ──────────────────────────── Backend: .NET 10 Web API ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: KiloImportService.Api/Dockerfile
      # Build-args для корп. контура (см. doc_project/129). Дефолты — публичные хосты,
      # сборка работает «из коробки». В закрытом контуре задать переменные в .env.
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0-preview-alpine}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0-preview-alpine}
        # NUGET_FEED_URL опц.: пусто → берётся BinaryNuGetMirror из nuget.config (эталон).
        # Для локальной сборки задаём nuget.org через override.
        NUGET_FEED_URL: ${NUGET_FEED_URL:-https://api.nuget.org/v3/index.json}
    container_name: kilo-import-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      # Connection strings: для dev строятся из частей IMPORT_SERVICE_DB_*/VISARY_DB_*
      # (docker-compose postgres-контейнеры). Для prod с managed-PostgreSQL — задать
      # ConnectionStrings__ServiceDb / ConnectionStrings__VisaryDb целиком в .env,
      # и они перекроют построенные. См. doc_project/122-environment-config.md.
      ConnectionStrings__ServiceDb: ${ConnectionStrings__ServiceDb:-Host=postgres-service;Port=5432;Database=import_service_db;Username=${IMPORT_SERVICE_DB_USER};Password=${IMPORT_SERVICE_DB_PASSWORD}}
      ConnectionStrings__VisaryDb: ${ConnectionStrings__VisaryDb:-Host=postgres-visary;Port=5432;Database=visary_webapi_db;Username=${VISARY_DB_USER};Password=${VISARY_DB_PASSWORD}}
      ImportStorage__Path: /var/lib/import-files
      # CORS: публичный URL UI per-среда (см. .env: UI_PUBLIC_URL)
      Cors__AllowedOrigins__0: ${UI_PUBLIC_URL:?UI_PUBLIC_URL не задан — скопируй .env.example → .env (см. doc_project/122)}
      # Visary API (per-среда). SSOT — VISARY_BASE_URL в .env.
      # Deny-by-default: без значения сервис не стартует, чтобы хост test-стенда
      # не уехал случайно в prod.
      Visary__BaseUrl: ${VISARY_BASE_URL:?VISARY_BASE_URL не задан — скопируй .env.example → .env (см. doc_project/122)}
      Visary__BearerToken: ${Visary__BearerToken:-}
      Visary__Auth__TokenEndpoint: ${Visary__Auth__TokenEndpoint:-}
      Visary__Auth__ClientId: ${Visary__Auth__ClientId:-visary-ui}
      VISARY_AUTH_REFRESH_TOKEN: ${VISARY_AUTH_REFRESH_TOKEN:-}
      # JWT-валидация ВХОДЯЩИХ запросов (опц., см. doc 111). Пусто = выключено.
      Auth__Authority: ${Auth__Authority:-}
      Auth__Audience: ${Auth__Audience:-kilo-import-api}
      Auth__RequireHttpsMetadata: ${Auth__RequireHttpsMetadata:-true}
    ports:
      - "5000:5000"
    volumes:
      - import-files:/var/lib/import-files
    depends_on:
      postgres-service:
        condition: service_healthy
      postgres-visary:
        condition: service_healthy
    # wget (а не curl) — curl не входит в base aspnet:alpine, а apk add его не ставит
    # (нет корп. Alpine-зеркала, см. doc 132). wget — из busybox, всегда есть.
    # На k8s этот healthcheck не используется — там httpGet probes (см. doc 130).
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - kilo-net

  # ──────────────────────────── Frontend: React + Vite ──────────────────────────────────────
  frontend:
    build:
      context: ./KiloImportService.Web
      dockerfile: Dockerfile
      # Локальный compose — dev-стенд с hot-reload (Vite на :5173).
      # Для k8s/prod собирается отдельным `docker build --target prod` (nginx, см. doc 130).
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        # Локально по умолчанию — публичный npmjs.org (быстрее, полный набор).
        # В корп. контуре передаётся через .env: virtual репо Артифактори Альфы
        # `https://binary.alfabank.ru/artifactory/api/npm/npm/` (содержит alfalab-internal
        # пакеты `@alfalab/*` + публичные через proxy; путь `/api/npm/<repo>/` —
        # обязательный, без него Артифактори отдаёт 406 Not Acceptable npm-клиенту).
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org}
        NPM_REGISTRY_ALFALAB_URL: ${NPM_REGISTRY_ALFALAB_URL:-https://registry.npmjs.org/}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    container_name: kilo-import-frontend
    restart: unless-stopped
    environment:
      # Vite proxy при dev-сборке; в prod-bundle Vite не работает — запросы
      # идут на same-origin /api/visary/* через nginx/backend.
      VITE_BACKEND_URL: http://backend:5000
      # Маппинг SSOT VISARY_BASE_URL → VITE_VISARY_API_URL. Один источник для backend+frontend.
      VITE_VISARY_API_URL: ${VISARY_BASE_URL:?VISARY_BASE_URL не задан — скопируй .env.example → .env (см. doc_project/122)}
      VITE_VISARY_API_TOKEN: ${VITE_VISARY_API_TOKEN:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - kilo-net

# ──────────────────────────── Persistence ────────────────────────────────────
volumes:
  pg-service-data:
    name: kilo-import_pg-service-data
  pg-visary-data:
    name: kilo-import_pg-visary-data
  import-files:
    name: kilo-import_import-files

networks:
  kilo-net:
    name: kilo-import_net
    driver: bridge
